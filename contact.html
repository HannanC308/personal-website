<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | HannanC308</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #e2e8f0;
            --accent-color: #38bdf8;
            --card-bg: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            line-height: 1.6;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            background-color: rgba(15, 23, 42, 0.9);
        }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--accent-color); text-decoration: none; }
        nav a { color: var(--text-color); text-decoration: none; margin-left: 1.5rem; }
        nav a:hover { color: var(--accent-color); }

        .container {
            max-width: 600px;
            margin: 4rem auto;
            padding: 0 1.5rem;
            text-align: center;
        }
        h2 { color: var(--accent-color); }
        p { color: #94a3b8; margin-bottom: 2rem; }
        
        .contact-card {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .email-link {
            display: inline-block;
            font-size: 1.25rem;
            color: var(--accent-color);
            text-decoration: none;
            margin-bottom: 1.5rem;
            font-weight: bold;
        }
        .email-link:hover { text-decoration: underline; }
        
        footer { text-align: center; padding: 2rem; color: #64748b; font-size: 0.9rem; position: absolute; bottom: 0; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">HannanC308</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="container">
        <div class="contact-card">
            <h2>🌐 Let's Collaborate</h2>
            <p>I am always looking for exciting opportunities in full-stack, game development, or cloud architecture spaces. Drop me an email or find me on GitHub!</p>
            <a href="mailto:hannac@gmail.com" class="email-link">hannac@gmail.com</a>
        </div>
    </main>

    <footer>
        &copy; 2026 HannanC308.
    </footer>

</body>
</html>
